<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe6ff">
<meta name="apple-mobile-web-app-title" content="動物園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>可愛動物園</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#3d3328}
canvas{display:block;touch-action:none}
.card{background:rgba(255,253,246,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;box-shadow:0 4px 14px rgba(60,80,40,.15)}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
.row{display:flex;gap:8px;align-items:stretch}
#status{flex:1;padding:8px 12px;min-width:0}
#nameRow{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px}
#level{font-size:12px;font-weight:700;color:#c06a3a}
#barWrap{height:9px;background:#efe3d2;border-radius:6px;margin-top:6px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ffb3c1,#ff6f91);border-radius:6px;transition:width .4s}
#stats{padding:4px 10px;font-size:11px;display:flex;flex-direction:column;justify-content:center;gap:2px;white-space:nowrap}
#stats b{font-size:13px}
#tabs{display:flex;gap:4px;margin-top:8px;pointer-events:auto}
#tabs button{flex:1;min-width:0;border:0;border-radius:12px;padding:5px 0 4px;font-family:inherit;font-size:11px;font-weight:700;color:#5a4c3c;background:rgba(255,253,246,.75);box-shadow:0 2px 8px rgba(60,80,40,.12);display:flex;flex-direction:column;align-items:center;line-height:1.15}
#tabs button span{font-size:19px}
#tabs button.on{background:#fff;box-shadow:0 0 0 3px #f4b740 inset,0 3px 10px rgba(60,80,40,.18);color:#3d3328}
#tools{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;gap:10px}
#tools button{flex:1;max-width:120px;border:0;border-radius:18px;padding:10px 4px 8px;font-size:13px;font-weight:700;color:#3d3328;background:rgba(255,253,246,.93);box-shadow:0 4px 12px rgba(60,80,40,.18);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;transition:transform .1s,background .2s}
#tools button span{font-size:26px;line-height:1.1}
#tools button:active{transform:scale(.94)}
#tools button.on{background:#ffe08a;box-shadow:0 0 0 3px #f4b740 inset,0 4px 12px rgba(60,80,40,.18)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);padding:7px 14px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .3s;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#bubble{position:fixed;left:0;top:0;padding:7px 13px;font-size:15px;font-weight:700;background:#fff;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.15);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#toast{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.8);padding:14px 22px;font-size:17px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.6,.5,1);max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(191,230,255,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:5;padding:20px}
#intro .card{padding:24px 22px;max-width:350px;width:100%;text-align:center}
#intro h1{margin:4px 0 8px;font-size:24px}
#intro .list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px;text-align:left;font-size:13px;line-height:1.45;color:#6b5d4d}
#intro .list div{background:#fbf3e4;border-radius:12px;padding:8px 10px}
#intro .list b{color:#3d3328}
#startBtn{width:100%;border:0;border-radius:14px;padding:13px;font-size:17px;font-weight:800;background:linear-gradient(180deg,#8fd16a,#5fae3c);color:#fff;font-family:inherit;box-shadow:0 4px 0 #4a8f2c}
#startBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a8f2c}
.emoji{font-size:44px;letter-spacing:4px}
</style>
</head>
<body>
<div id="top">
  <div class="row">
    <div id="status" class="card">
      <div id="nameRow"><span id="spName">咩咩羊</span><span id="level">陌生</span></div>
      <div id="barWrap"><div id="bar"></div></div>
    </div>
    <div id="stats" class="card"><div>🧶 <b id="wool">0</b></div><div>🥚 <b id="eggs">0</b></div><div>🥛 <b id="milk">0</b></div></div>
  </div>
  <div id="tabs"></div>
</div>
<div id="bubble"></div>
<div id="toast" class="card"></div>
<div id="hint" class="card"></div>
<div id="tools"></div>
<div id="intro">
  <div class="card">
    <div class="emoji">🐑🐔🦆🪿<br>🐄🐱🐶🐷</div>
    <h1>可愛動物園</h1>
    <div class="list">
      <div><b>🐑 羊</b>・剪羊毛</div>
      <div><b>🐔 雞</b>・撿雞蛋</div>
      <div><b>🦆 鴨</b>・排隊游泳</div>
      <div><b>🪿 鵝</b>・小心被追</div>
      <div><b>🐄 牛</b>・擠牛奶</div>
      <div><b>🐱 貓</b>・逗貓棒</div>
      <div><b>🐶 狗</b>・丟球表演</div>
      <div><b>🐷 豬</b>・泥巴澡</div>
    </div>
    <button id="startBtn">走進動物園</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 儲存 ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('zoo_'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('zoo_'+k, JSON.stringify(v)); }catch(e){} }
};
const AFF = Object.assign({ sheep:0, chicken:0, duck:0, goose:0, cow:0, cat:0, dog:0, pig:0 }, store.get('aff', {}));
try{ if(!AFF.sheep){ const old = JSON.parse(localStorage.getItem('sheep_aff')); if(old) AFF.sheep = old; } }catch(e){}
let woolCount = store.get('wool', 0), eggCount = store.get('eggs', 0), outfit = store.get('outfit', 0), milkCount = store.get('milk', 0);

// ---------- 物種設定 ----------
const SP = {
  sheep:  { name:'咩咩羊', emoji:'🐑', tab:'羊', dist:10.5, fy:1,  tools:[['👋','打招呼','greet'],['🌿','餵草','m:grass'],['✂️','剪毛','m:shear']] },
  chicken:{ name:'咕咕雞', emoji:'🐔', tab:'雞', dist:6.5, fy:.5, tools:[['👋','打招呼','greet'],['🌽','撒玉米','m:grain'],['🥚','下蛋','lay']] },
  duck:   { name:'呱呱鴨', emoji:'🦆', tab:'鴨', dist:8,   fy:.4, tools:[['👋','打招呼','greet'],['🍞','丟麵包','m:bread'],['🎶','排隊游','parade']] },
  goose:  { name:'大白鵝', emoji:'🪿', tab:'鵝', dist:9,   fy:.9, tools:[['👋','打招呼','greet'],['🥬','餵菜葉','m:leaf'],['🎀','換裝','dress']] },
  cow:    { name:'哞哞牛', emoji:'🐄', tab:'牛', dist:11,  fy:1.2, tools:[['👋','打招呼','greet'],['🌾','餵乾草','m:hay'],['🥛','擠牛奶','milk']] },
  cat:    { name:'橘子貓', emoji:'🐱', tab:'貓', dist:5,   fy:.4, tools:[['👋','打招呼','greet'],['🪶','逗貓棒','m:toy'],['🐟','餵魚乾','m:fish']] },
  dog:    { name:'旺財狗', emoji:'🐶', tab:'狗', dist:6.5, fy:.6, tools:[['👋','打招呼','greet'],['🎾','丟球','m:ball'],['🦴','表演','trick']] },
  pig:    { name:'迷你豬', emoji:'🐷', tab:'豬', dist:5.5, fy:.4, tools:[['👋','打招呼','greet'],['🍎','餵蘋果','m:apple'],['🛁','泥巴澡','mud']] },
};
const HINTS = {
  sheep:'點小羊摸摸牠，拖曳畫面可以轉視角',
  chicken:'撒玉米給雞吃，按「下蛋」後點雞蛋撿起來',
  duck:'把麵包丟進池塘，點鴨媽媽牠會潛水',
  goose:'鵝很兇！還不熟就去摸會被追喔 😱',
  cow:'牛很溫和，先餵乾草變熟再擠牛奶 🥛',
  cat:'貓咪有點傲嬌，用逗貓棒陪牠玩',
  dog:'丟球給狗狗撿，熟了就會表演把戲',
  pig:'小豬愛玩泥巴，玩髒了再按一次幫牠洗澡'
};
const MODE_HINT = { grass:'點草地放一把嫩草 🌿', shear:'在小羊身上滑動來剪毛 ✂️', grain:'點地上撒一把玉米粒 🌽', bread:'點池塘丟一塊麵包 🍞', leaf:'點地上放一片菜葉 🥬', hay:'點草地放一堆乾草 🌾', toy:'點地上揮逗貓棒 🪶', fish:'點地上放一條魚乾 🐟', ball:'點地上把球丟過去 🎾', apple:'點地上放一顆蘋果 🍎' };
const FOODT = { sheep:['grass'], chicken:['grain'], duck:['bread'], goose:['leaf'], cow:['hay'], cat:['fish'], dog:[], pig:['apple'] };
const EATT = { grass:3.2, grain:.5, bread:1, leaf:2.4, hay:3.5, fish:1.6, apple:1.8 };
const GAIN = { grass:4, grain:.6, bread:2.5, leaf:4, hay:4, fish:4, apple:4 };
const FOODSAY = { sheep:'咩！好香～', chicken:'咕咕！有好料！', duck:'呱呱呱！麵包！', goose:'嘎？是菜葉！', cow:'哞～乾草！', cat:'喵！魚的味道！', pig:'齁齁！蘋果！' };
const EATSAY = {
  sheep:['好好吃！咩～','還要還要！','謝謝你～','嚼嚼…讚！'],
  chicken:['咕咕～好吃','咯咯咯♪'],
  duck:['呱～好好吃！','還有嗎？呱！'],
  goose:['嘎～清脆！','嘎嘎，你人不錯嘛','（滿意地抖羽毛）'],
  cow:['哞～好吃','（慢慢嚼）','哞！謝謝'],
  cat:['喵嗚～','（舔舔嘴）','還有嗎？喵'],
  pig:['齁齁齁！','好甜～齁！','（尾巴捲捲）']
};
const LEVELS = [[0,'陌生'],[20,'有點熟了'],[50,'好朋友'],[80,'最好的朋友 💕']];
const levelOf = a => LEVELS.filter(l => a >= l[0]).length - 1;

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6ff);
scene.fog = new THREE.Fog(0xbfe6ff, 40, 95);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 220);
camera.position.set(2, 4.5, 2);

scene.add(new THREE.HemisphereLight(0xffffff, 0x7fae5a, 0.75));
const sun = new THREE.DirectionalLight(0xfff1d6, 0.85);
sun.position.set(10, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-24, right:24, top:24, bottom:-24, near:1, far:60 });
scene.add(sun);

const matCache = {};
const lam = c => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color:c }));
const SPH = new THREE.SphereGeometry(1, 16, 12);
const CONE = new THREE.ConeGeometry(1, 1, 10);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 10);
const WHITE = new THREE.MeshBasicMaterial({ color:0xffffff });
const BLADE = new THREE.ConeGeometry(.05, .55, 4), STRAW = new THREE.ConeGeometry(.03, .4, 3), RING = new THREE.RingGeometry(.85, 1, 32);
function M(geo, col, parent, p=[0,0,0], s=[1,1,1], r=[0,0,0]){
  const m = new THREE.Mesh(geo, typeof col === 'number' ? lam(col) : col);
  m.position.set(...p); m.scale.set(...s); m.rotation.set(...r);
  parent.add(m); return m;
}
const shadowAll = o => o.traverse(m => { if(m.isMesh) m.castShadow = true; });

const FENCE_R = 21;
const POND = new V3(9, 0, 7), POND_R = 4.6;
const COOP = new V3(-15, 0, 9), NEST = new V3(-12.8, 0, 7.4);
const HOMES = {
  sheep:  { c:new V3(0, 0, -6),  r:6 },
  chicken:{ c:new V3(-10, 0, 4), r:3.5 },
  duck:   { c:POND,              r:3.6 },
  goose:  { c:new V3(13, 0, -4), r:3.5 },
  cow:    { c:new V3(-11, 0, -9), r:3.5 },
  cat:    { c:new V3(-13, 0, -1), r:2.5 },
  dog:    { c:new V3(4, 0, -13),  r:4 },
  pig:    { c:new V3(-3, 0, 12),  r:2.8 }
};
const MUD = new V3(-3, 0, 14.2), DOGHOUSE = new V3(6.5, 0, -16), HAY = new V3(-16.2, 0, -2);
const OBST = [{ c:COOP, r:2.3 }, { c:DOGHOUSE, r:1.3 }, { c:HAY, r:1.5 }];

const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 48), lam(0x8fd16a));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
// 小路
{
  const path = new THREE.Mesh(new THREE.RingGeometry(9.5, 11, 64), lam(0xd9c49a));
  path.rotation.x = -Math.PI/2; path.position.y = .01; path.receiveShadow = true; scene.add(path);
}
// 草叢
{
  const geo = new THREE.ConeGeometry(0.06, 0.35, 3); geo.translate(0, .17, 0);
  const n = 1400, inst = new THREE.InstancedMesh(geo, lam(0x6cbf4a), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), p = new V3(), e = new THREE.Euler();
  let i = 0;
  while(i < n){
    const r = Math.sqrt(Math.random())*40, a = Math.random()*Math.PI*2;
    p.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    if(p.distanceTo(POND) < POND_R + .7) continue;
    if(r > 9.4 && r < 11.1) continue;
    e.set((Math.random()-.5)*.4, Math.random()*3, (Math.random()-.5)*.4); q.setFromEuler(e);
    const k = .6 + Math.random()*.9; s.set(k, k, k);
    m.compose(p, q, s); inst.setMatrixAt(i++, m);
  }
  scene.add(inst);
}
// 小花
{
  const cols = [0xffffff, 0xffe066, 0xffa6c9, 0xc9a6ff];
  for(let i=0;i<120;i++){
    const r = 2 + Math.random()*36, a = Math.random()*Math.PI*2;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(Math.hypot(x-POND.x, z-POND.z) < POND_R + .8) continue;
    M(SPH, cols[i%4], scene, [x, .14, z], [.08, .08, .08]);
  }
}
// 圍籬
{
  const N = 56, wood = lam(0xc9a27a), postG = new THREE.BoxGeometry(0.16, 1.1, 0.16);
  for(let i=0;i<N;i++){
    const a = i/N*Math.PI*2, a2 = (i+1)/N*Math.PI*2;
    const post = new THREE.Mesh(postG, wood);
    post.position.set(Math.cos(a)*FENCE_R, .55, Math.sin(a)*FENCE_R); post.castShadow = true; scene.add(post);
    const x1 = Math.cos(a)*FENCE_R, z1 = Math.sin(a)*FENCE_R, x2 = Math.cos(a2)*FENCE_R, z2 = Math.sin(a2)*FENCE_R;
    const len = Math.hypot(x2-x1, z2-z1);
    for(const h of [.45, .85]){
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len, .09, .06), wood);
      rail.position.set((x1+x2)/2, h, (z1+z2)/2); rail.rotation.y = -Math.atan2(z2-z1, x2-x1); scene.add(rail);
    }
  }
}
// 池塘
const water = new THREE.Mesh(new THREE.CircleGeometry(POND_R, 40), new THREE.MeshPhongMaterial({ color:0x3fa9d6, shininess:60, specular:0xffffff, transparent:true, opacity:.92 }));
water.rotation.x = -Math.PI/2; water.position.set(POND.x, .03, POND.z); water.receiveShadow = true; scene.add(water);
{
  const sand = new THREE.Mesh(new THREE.RingGeometry(POND_R-.05, POND_R+.6, 40), lam(0xe8d6a6));
  sand.rotation.x = -Math.PI/2; sand.position.set(POND.x, .02, POND.z); sand.receiveShadow = true; scene.add(sand);
  for(let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2, r = POND_R + .3 + Math.random()*.4;
    M(SPH, 0x9a968e, scene, [POND.x+Math.cos(a)*r, .08, POND.z+Math.sin(a)*r], [.25+Math.random()*.2, .15, .2+Math.random()*.2]);
  }
  for(let i=0;i<5;i++){
    const a = 3.6 + i*.18, r = POND_R - .2;
    for(let j=0;j<3;j++) M(CYL, 0x5d8f3a, scene, [POND.x+Math.cos(a)*r + j*.08, .55, POND.z+Math.sin(a)*r + j*.06], [.025, 1.1 + Math.random()*.4, .025]);
  }
  for(let i=0;i<4;i++){
    const a = i*1.6 + .4, r = 2.2 + (i%2)*1.2;
    const pad = M(CYL, 0x4fa54a, scene, [POND.x+Math.cos(a)*r, .045, POND.z+Math.sin(a)*r], [.38, .01, .38]);
    if(i%2===0) M(SPH, 0xffb6d0, scene, [pad.position.x, .1, pad.position.z], [.1, .08, .1]);
  }
}
// 雞舍
{
  const c = new THREE.Group();
  M(new THREE.BoxGeometry(2.4, 1.6, 2.2), 0xe0a96d, c, [0, .8, 0]);
  const roofL = M(new THREE.BoxGeometry(2.8, .12, 1.5), 0xb5473a, c, [0, 1.9, .55], [1,1,1], [.75, 0, 0]);
  const roofR = M(new THREE.BoxGeometry(2.8, .12, 1.5), 0xb5473a, c, [0, 1.9, -.55], [1,1,1], [-.75, 0, 0]);
  M(new THREE.BoxGeometry(.04, .8, .6), 0x6b4a32, c, [1.21, .45, 0]);
  M(new THREE.BoxGeometry(.04, .35, .35), 0xfff2c8, c, [1.21, 1.2, .6]);
  M(new THREE.BoxGeometry(1.2, .06, .5), 0xb08458, c, [1.75, .2, 0], [1,1,1], [0, 0, -.35]);
  c.position.copy(COOP); c.rotation.y = -.5; shadowAll(c); scene.add(c);
  const nest = new THREE.Mesh(new THREE.TorusGeometry(.38, .13, 8, 16), lam(0xe8c872));
  nest.rotation.x = -Math.PI/2; nest.position.set(NEST.x, .1, NEST.z); scene.add(nest);
  M(SPH, 0xd9b45a, scene, [NEST.x, .05, NEST.z], [.38, .05, .38]);
}
// 狗屋
{
  const d = new THREE.Group();
  M(new THREE.BoxGeometry(1.3, 1, 1.5), 0xe8b04b, d, [0, .5, 0]);

(function mergeStatic(){
  const skip = new Set();
  [ground, water, bucket, ...clouds].forEach(o => o.traverse(c => skip.add(c)));
  scene.updateMatrixWorld(true);
  const groups = new Map(), merged = [];
  scene.traverse(o => {
    if(!o.isMesh || o.isInstancedMesh || skip.has(o)) return;
    const key = o.material.uuid + (o.castShadow ? 's' : '') + (o.receiveShadow ? 'r' : '');
    if(!groups.has(key)) groups.set(key, { mat:o.material, cast:o.castShadow, recv:o.receiveShadow, list:[] });
    groups.get(key).list.push(o);
  });
  const cat = arrs => { const out = new Float32Array(arrs.reduce((n, a) => n + a.length, 0)); let k = 0; for(const a of arrs){ out.set(a, k); k += a.length; } return out; };
  for(const g of groups.values()){
    if(g.list.length < 2) continue;
    const pos = [], nor = [];
    for(const m of g.list){
      const geo = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      geo.applyMatrix4(m.matrixWorld);
      pos.push(geo.attributes.position.array); nor.push(geo.attributes.normal.array);
      geo.dispose(); merged.push(m);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(cat(pos), 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(cat(nor), 3));
    const mesh = new THREE.Mesh(geo, g.mat); mesh.castShadow = g.cast; mesh.receiveShadow = g.recv;
    scene.add(mesh);
  }
  merged.forEach(m => m.parent.remove(m));
})();

function spotTex(seed, n, opt = {}){

  let s = seed; const rnd = () => (s = (s*16807) % 2147483647)/2147483647;
  x.fillStyle = '#272323';
  const blob = (cx, cy, r) => {
    const parts = [[cx, cy, r]];
    for(let j=0;j<6;j++){ const a = rnd()*6.28, d = r*(.3 + rnd()*.45); parts.push([cx + Math.cos(a)*d*1.4, cy + Math.sin(a)*d, r*(.45 + rnd()*.35)]); }
    for(const dx of [-w, 0, w]) for(const [px, py, pr] of parts){ x.beginPath(); x.ellipse(px + dx, py, pr*1.3, pr, 0, 0, Math.PI*2); x.fill(); }
  };
  (opt.spots || []).forEach(([u, v, r]) => blob(u*w, v*h, r*h));
  for(let i=0;i<n;i++) blob(rnd()*w, h*((opt.vmin ?? .22) + rnd()*((opt.vmax ?? .62) - (opt.vmin ?? .22))), h*((opt.rmin ?? .09) + rnd()*.09));
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

const NO_PUSH = ['lay', 'milk', 'pounce', 'trick', 'roll', 'bath', 'crouch'];
function separate(){
  for(let i=0;i<animals.length;i++) for(let j=i+1;j<animals.length;j++){
    const a = animals[i], b = animals[j];
    if(a.water !== b.water) continue;
    const dx = b.g.position.x - a.g.position.x, dz = b.g.position.z - a.g.position.z;
    const d = Math.hypot(dx, dz), min = a.rad + b.rad;
    if(d >= min || d < 1e-4) continue;
    const fa = NO_PUSH.includes(a.state) ? 0 : 1, fb = NO_PUSH.includes(b.state) ? 0 : 1;
    if(!fa && !fb) continue;
    const push = (min - d)/(fa + fb), nx = dx/d, nz = dz/d;
    a.g.position.x -= nx*push*fa; a.g.position.z -= nz*push*fa;
    b.g.position.x += nx*push*fb; b.g.position.z += nz*push*fb;
  }
}

let actx = null;
function tone(o){
  if(!actx) return;
  const t = actx.currentTime + (o.delay || 0), dur = o.dur;
  const osc = actx.createOscillator(); osc.type = o.type || 'sawtooth';
  osc.frequency.setValueAtTime(o.f0, t); osc.frequency.linearRampToValueAtTime(o.f1 || o.f0, t + dur);
  if(o.vib){
    const l = actx.createOscillator(), lg = actx.createGain();
    l.frequency.value = o.vibF || 22; lg.gain.value = o.vib; l.connect(lg); lg.connect(osc.frequency);
    l.start(t); l.stop(t + dur + .05);
  }
  const g = actx.createGain(), v = o.vol || .3;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + Math.min(.04, dur*.2));
  g.gain.linearRampToValueAtTime(v*.75, t + dur*.7); g.gain.linearRampToValueAtTime(0, t + dur);
  if(o.bp){ const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.q || 2; osc.connect(f); f.connect(g); }
  else osc.connect(g);
  g.connect(actx.destination); osc.start(t); osc.stop(t + dur + .05);
}
function noise(o){
  if(!actx) return;
  const t = actx.currentTime + (o.delay || 0), len = Math.floor(actx.sampleRate*o.dur);
  const b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2 - 1)*(1 - i/len);
  const n = actx.createBufferSource(); n.buffer = b;
  const f = actx.createBiquadFilter(); f.type = o.hp ? 'highpass' : 'lowpass'; f.frequency.value = o.hp || o.lp;
  const g = actx.createGain(); g.gain.value = o.vol;
  n.connect(f); f.connect(g); g.connect(actx.destination); n.start(t);
}
function baa(p = 1, len = .75){
  tone({ f0:340*p, f1:300*p, dur:len, vib:20*p, vibF:24, bp:900*p, q:1.4, vol:.5 });
  tone({ f0:342*p, f1:302*p, dur:len, vib:20*p, vibF:24, bp:2400*p, q:3, vol:.22 });
  sheepA.baaT = .5;
}
function cluck(n = 3){ for(let i=0;i<n;i++) tone({ type:'square', f0:560, f1:380, dur:.07, bp:900, q:3, vol:.28, delay:i*.11 }); }

function moo(p = 1){ tone({ f0:150*p, f1:115*p, dur:1.1, bp:450*p, q:1.5, vol:.55, vib:3, vibF:6 }); tone({ f0:300*p, f1:230*p, dur:1.1, bp:900*p, q:3, vol:.18, vib:6, vibF:6 }); }

function purr(d = 1.6){
  if(!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 28;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .2); g.gain.setValueAtTime(.35, t + d - .3); g.gain.linearRampToValueAtTime(0, t + d);
  const l = actx.createOscillator(); l.frequency.value = 2.2; const lg = actx.createGain(); lg.gain.value = .15; l.connect(lg); lg.connect(g.gain);
  o.connect(f); f.connect(g); g.connect(actx.destination); o.start(t); l.start(t); o.stop(t + d); l.stop(t + d);
}
const squirt = () => noise({ dur:.1, hp:1800, vol:.12 });

const SB = {}, lastPlay = {};
function playReal(key){
  const list = SB[key];
  if(!actx || !list || !list.length) return false;
  const now = actx.currentTime;
  if(lastPlay[key] && now - lastPlay[key] < .3) return true;
  lastPlay[key] = now;
  const src = actx.createBufferSource(); src.buffer = pick(list);
  src.playbackRate.value = .93 + Math.random()*.14;
  const g = actx.createGain(), maxLen = 2.7;
  g.gain.setValueAtTime(.9, now); g.gain.setValueAtTime(.9, now + maxLen - .25); g.gain.linearRampToValueAtTime(0, now + maxLen);
  src.connect(g); g.connect(actx.destination); src.start(now); src.stop(now + maxLen);
  return true;
}
function decode(buf){ return new Promise((ok, no) => actx.decodeAudioData(buf, ok, no)); }
function b64buf(b64){ const bin = atob(b64), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u.buffer; }
async function loadRealSounds(){
  for(const [key, list] of Object.entries(SND_DATA)){
    const bufs = [];
    for(const b64 of list){ try{ bufs.push(await decode(b64buf(b64))); }catch(e){} }
    if(bufs.length) SB[key] = bufs;
  }
}
function wrapSnd(fn, key){ return function(...args){ if(playReal(key)){ if(key === 'baa') sheepA.baaT = .5; return; } return fn.apply(this, args); }; }
baa = wrapSnd(baa, 'baa'); cluck = wrapSnd(cluck, 'cluck'); peep = wrapSnd(peep, 'peep'); quack = wrapSnd(quack, 'quack');
honk = wrapSnd(honk, 'honk'); moo = wrapSnd(moo, 'moo'); meow = wrapSnd(meow, 'meow'); purr = wrapSnd(purr, 'purr');
bark = wrapSnd(bark, 'bark'); oink = wrapSnd(oink, 'oink'); squeal = wrapSnd(squeal, 'squeal'); bell = wrapSnd(bell, 'bell');
// ---------- UI ----------
let sel = 'sheep', mode = 'none', focusT = 0;
const tabsEl = $('tabs'), toolsEl = $('tools');
Object.keys(SP).forEach(k => {
  const b = document.createElement('button');
  b.innerHTML = `<span>${SP[k].emoji}</span>${SP[k].tab}`; b.dataset.sp = k;
  b.onclick = () => selectSp(k);
  tabsEl.appendChild(b);
});
function buildTools(){
  toolsEl.innerHTML = '';
  SP[sel].tools.forEach(([e, l, act]) => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${e}</span>${l}`; b.dataset.act = act;
    b.onclick = () => doAct(act);
    toolsEl.appendChild(b);
  });
}
function refreshUI(){
  $('spName').textContent = SP[sel].name;
  $('level').textContent = LEVELS[levelOf(AFF[sel])][1];
  $('bar').style.width = AFF[sel] + '%';
  $('wool').textContent = woolCount; $('eggs').textContent = eggCount; $('milk').textContent = milkCount;
  [...tabsEl.children].forEach(b => b.classList.toggle('on', b.dataset.sp === sel));
  [...toolsEl.children].forEach(b => b.classList.toggle('on', b.dataset.act === 'm:' + mode));
}
function selectSp(sp){
  if(sel === sp) return;
  sel = sp; mode = 'none'; focusT = 1.4;
  const pf = camera.aspect < 1 ? 1.3 : 1;
  controls.minDistance = SP[sp].dist*.7*pf; controls.maxDistance = Math.max(26, SP[sp].dist*2.2);
  buildTools(); refreshUI(); hint(HINTS[sp]);
}
function setMode(m){
  mode = (mode === m) ? 'none' : m;
  refreshUI();
  hint(mode !== 'none' ? MODE_HINT[mode] : HINTS[sel]);
}
function doAct(act){
  if(act.startsWith('m:')){ setMode(act.slice(2)); return; }
  if(mode !== 'none'){ mode = 'none'; refreshUI(); hint(HINTS[sel]); }
  if(act === 'greet') greet(sel);
  else if(act === 'lay') layEgg(false);
  else if(act === 'parade') parade();
  else if(act === 'dress') dress();
  else if(act === 'milk') milkCow();
  else if(act === 'trick') trick();
  else if(act === 'mud') mudBath();
}
function addAff(sp, n){
  const before = levelOf(AFF[sp]);
  AFF[sp] = clamp(AFF[sp] + n, 0, 100);
  store.set('aff', AFF); refreshUI();
  const after = levelOf(AFF[sp]);
  if(after > before) setTimeout(() => toast(`🎉 ${SP[sp].name}跟你變成「${LEVELS[after][1]}」了！`), 400);
}
let bubbleT = 0, speaker = null;

let toastTimer;

const foods = [];

// ---------- 行為 ----------
const tmp = new V3();
function playerPoint(){ return clampFence(new V3(camera.position.x, 0, camera.position.z)); }
function clampDomain(a, p){
  p = p.clone(); p.y = 0;
  const d = p.clone().sub(POND); d.y = 0; const L = d.length();
  if(a.water){ const R = POND_R - .75; if(L > R) p.copy(POND).addScaledVector(d.normalize(), R); return p; }
  clampFence(p);
  const R = POND_R + .9;
  if(L < R) p.copy(POND).addScaledVector(L > .01 ? d.normalize() : new V3(1, 0, 0), R);
  for(const ob of OBST){ const q = p.clone().sub(ob.c); q.y = 0; const l = q.length(); if(l < ob.r) p.copy(ob.c).addScaledVector(l > .01 ? q.normalize() : new V3(1, 0, 0), ob.r); }
  p.y = 0; return p;
}
function walkTo(a, p, spd, then = null){ a.target.copy(clampDomain(a, p)); a.spd = spd; a.state = 'walk'; a.then = then; if(a.quad && a.pose !== 'flip') a.pose = a.stalk ? 'crouch' : 'none'; }
function homePoint(a){ const h = HOMES[a.sp], ang = Math.random()*Math.PI*2, r = Math.random()*h.r; return h.c.clone().add(new V3(Math.cos(ang)*r, 0, Math.sin(ang)*r)); }
function approach(a, pp, k, spd, then){
  const dir = pp.clone().sub(a.g.position); dir.y = 0;
  const d = dir.length(); if(d < .1) return;
  const go = k >= 1 ? Math.max(0, d - 2.6) : d*k;
  walkTo(a, a.g.position.clone().addScaledVector(dir.normalize(), go), spd, then);
}
function runAway(a, dist){
  const dir = a.g.position.clone().sub(playerPoint()); dir.y = 0;
  if(dir.lengthSq() < .01) dir.set(1, 0, 0);
  walkTo(a, a.g.position.clone().addScaledVector(dir.normalize(), dist), a.fspd*1.2);
}
const hop = a => { a.hopT = .6; };

function moveStep(a, dt){
  tmp.copy(a.target).sub(a.g.position); tmp.y = 0;
  const d = tmp.length();
  if(d < .06) return false;
  const want = Math.atan2(-tmp.z, tmp.x);
  let diff = want - a.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  a.g.rotation.y += diff*Math.min(1, dt*a.turn);
  const step = Math.min(d, a.spd*dt*(Math.abs(diff) > 1.2 ? .35 : 1));
  a.g.position.addScaledVector(tmp.normalize(), step);
  a.phase += step*a.stride;
  return true;
}
function arrive(a){
  const f = a.then; a.then = null; a.state = 'idle';
  a.stateT = a.role === 'baby' ? .2 + Math.random()*.5 : 1.5 + Math.random()*3;
  if(f) f();
}
function seekFood(a){
  const types = FOODT[a.sp]; let best = null, bd = 1e9;
  for(const f of foods){
    if(!types.includes(f.type)) continue;
    if(!f.race && f.claim && f.claim !== a) continue;
    const d = f.pos.distanceTo(a.g.position); if(d < bd){ bd = d; best = f; }
  }
  if(!best) return false;
  a.food = best; if(!best.race) best.claim = a;
  const dir = a.g.position.clone().sub(best.pos); dir.y = 0;
  if(dir.lengthSq() < .001) dir.set(1, 0, 0);
  walkTo(a, best.pos.clone().addScaledVector(dir.normalize(), a.reach), a.fspd*(AFF[a.sp] < 20 ? .8 : 1), () => startEat(a));
  if(a.role === 'main' && Math.random() < .35 && (best.type !== 'grain' || Math.random() < .3)) say(a, FOODSAY[a.sp], 1.4);
  return true;
}
function startEat(a){
  const f = a.food;
  if(!f || !foods.includes(f) || (f.race && f.claim && f.claim !== a)){ a.food = null; return; }
  if(f.race) f.claim = a;
  a.state = 'eat'; a.stateT = EATT[f.type]; a.eatMax = a.stateT;
  a.g.rotation.y = Math.atan2(-(f.pos.z - a.g.position.z), f.pos.x - a.g.position.x);
}
function finishEat(a){
  const f = a.food; a.food = null; a.state = 'idle'; a.stateT = .3;
  if(!f) return;
  removeFood(f);
  addAff(a.sp, GAIN[f.type]*(a.role === 'baby' ? .5 : 1));
  if(a.role === 'baby'){ if(Math.random() < .4){ peep(); hop(a); } return; }
  const grain = f.type === 'grain';
  if(!grain || Math.random() < .15){
    say(a, pick(EATSAY[a.sp]), 1.6); voice(a.sp); hop(a); hearts(a, grain ? 1 : 3);
  }
}
function idleChoice(a){
  if(a.role === 'baby'){
    const p = a.parent;
    if(a.sp === 'duck'){
      const fwd = new V3(Math.cos(p.g.rotation.y), 0, -Math.sin(p.g.rotation.y));
      const tgt = p.g.position.clone().addScaledVector(fwd, -.6*(a.idx + 1));
      a.stateT = .15;
      if(tgt.distanceTo(a.g.position) > .15) walkTo(a, tgt, p.moving ? 1.9 : 1);
    } else {
      const ang = Math.random()*Math.PI*2, r = .5 + Math.random()*.9;
      walkTo(a, p.g.position.clone().add(new V3(Math.cos(ang)*r, 0, Math.sin(ang)*r)), p.moving ? 1.8 : 1.1);
      if(Math.random() < .25 && sel === 'chicken') peep();
    }
    return;
  }
  if(a.sp === 'cat' && Math.random() < .5){ a.pose = 'sit'; a.stateT = 4 + Math.random()*4; return; }
  const pp = playerPoint();
  const near = pp.distanceTo(HOMES[a.sp].c) < HOMES[a.sp].r + 7;
  if(near && AFF[a.sp] >= (a.sp === 'dog' ? 20 : 50) && Math.random() < .45 && a.g.position.distanceTo(pp) > 5) approach(a, pp, 1, a.wspd*1.4);
  else walkTo(a, homePoint(a), a.wspd*(.8 + Math.random()*.4));
  if(sel === a.sp && Math.random() < .2) setTimeout(() => voice(a.sp), 300);
  // 母雞好感高時會自己下蛋
  if(a === hen && AFF.chicken >= 50 && layCD <= 0 && Math.random() < .3) layEgg(true);

function nearestTap(e, includeAnimals){
  const v = new V3(), dpr = Math.min(1.6, Math.max(1, innerWidth/500));
  let best = null, bd = 1e9;
  const test = (obj, wp, r) => {
    v.copy(wp).project(camera); if(v.z > 1) return;
    const d = Math.hypot((v.x*.5 + .5)*innerWidth - e.clientX, (-v.y*.5 + .5)*innerHeight - e.clientY);
    if(d < r && d < bd){ bd = d; best = obj; }
  };
  eggs.forEach(eg => test(eg, eg.position, 34*dpr));
  if(includeAnimals) animals.forEach(a => { const p = new V3(); (a.P.bodyG || a.P.body).getWorldPosition(p); test(a, p, (a.role === 'baby' || a.sp === 'cat' ? 42 : 30)*dpr); });
  return best;
}
function onTap(e){
  setRay(e);
  const hits = ray.intersectObjects(animals.map(a => a.g).concat(eggs), true).filter(h => isVisible(h.object));
  if(hits.length){
    let o = hits[0].object;
    while(o && !o.userData.animal && !o.userData.egg) o = o.parent;
    if(o && o.userData.egg){ collectEgg(o); return; }
    if(o && o.userData.animal){
      const a = o.userData.animal;
      if(mode === 'shear' && a.sp === 'sheep') return;
      pet(a); return;
    }
  }
  // 沒點中：找手指附近的雞蛋或動物（小動物在手機上很難點中）
  const near = nearestTap(e, mode === 'none' || mode === 'shear');
  if(near){
    if(near.userData && near.userData.egg){ collectEgg(near); return; }
    if(near.sp && !(mode === 'shear' && near.sp === 'sheep')){ pet(near); return; }
  }
  if(mode === 'none' || mode === 'shear') return;
  const w = ray.intersectObject(water)[0], g = ray.intersectObject(ground)[0];
  if(mode === 'bread'){ if(w) placeFood('bread', w.point.clone()); else hint('要丟進池塘裡喔 💧'); }

    else if(mode === 'ball') throwBall(clampFence(g.point.clone()));

}

function animSheep(a, dt, t, moving){

  P.legs[1].rotation.z = -legSwing; P.legs[2].rotation.z = -legSwing;
  P.body.position.y = 1.15 + bob + Math.sin(t*2)*.012;

    if(p.visible && p.userData.cur < p.userData.s){ p.userData.cur = Math.min(p.userData.s, p.userData.cur + dt*.3); p.scale.setScalar(p.userData.cur); }

function animBird(a, dt, t, moving){
  const P = a.P;

function animQuad(a, dt, t, moving){
  const P = a.P, Q = a.q, k = Math.min(1, dt*8);

  // 頭

    pitch = a.eatPitch + Math.sin(t*12)*.06; yaw = 0;

  P.head.rotation.x += ((a.tiltT > 0 ? .45 : 0) - P.head.rotation.x)*Math.min(1, dt*8);
  // 尾巴
  const happy = AFF[a.sp] >= 50 || a.happyT > 0;
  if(a.sp === 'dog') P.tail.rotation.x = Math.sin(t*(happy || a.state === 'fetch' ? 22 : 8))*(happy ? .6 : .3);
  else if(a.sp === 'cow') P.tail.rotation.x = Math.sin(t*(a.swishT > 0 ? 14 : 1.6))*(a.swishT > 0 ? .7 : .25);
  else if(a.sp === 'pig') P.tail.rotation.x = Math.sin(t*12)*.4;
  else if(a.sp === 'cat') P.tailSegs.forEach((s, i) => { s.rotation.x = Math.sin(t*(a.state === 'crouch' ? 6 : 1.6) - i*.7 + a.seed)*(a.state === 'crouch' ? .45 : .28); });
  // 耳朵、眼睛、呼吸
  P.ears.forEach((e, i) => { e.rotation.y = Math.sin(t*1.2 + i*2 + a.seed)*.12 + (Math.sin(t*.6 + a.seed + i) > .97 ? .4 : 0); });
  a.blinkT = (a.blinkT ?? 2 + Math.random()*2) - dt;
  let ey = 1;
  if(a.blinkT < 0){ ey = .1; if(a.blinkT < -.14) a.blinkT = 2 + Math.random()*3; }
  if(a.hopT > 0 || a.purrT > 0 || (a.sp === 'cat' && pose === 'roll')) ey = .3;
  P.eyes.forEach(e => e.scale.y = ey);
  P.body.scale.y = 1 + Math.sin(t*2 + a.seed)*.015 + (a.purrT > 0 ? Math.sin(t*50)*.01 : 0);
  if(P.tongue) P.tongue.visible = a.happyT > 0 || (moving && a.spd > 2.4);
}

function updateAnimal(a, dt, t){
  a.swishT -= dt; a.swatT -= dt; a.tiltT -= dt; a.happyT -= dt; a.purrT -= dt;
  a.petCD -= dt; a.look -= dt; a.flapT -= dt;
  let moving = false;
  if(a.food && a.state === 'walk' && (!foods.includes(a.food) || (a.food.race && a.food.claim && a.food.claim !== a))){
    if(a.food.race && a.role === 'main' && foods.includes(a.food)){ say(a, '呱…被搶走了', 1.2); }
    a.food = null; a.then = null; a.state = 'idle'; a.stateT = .3;
  }
  switch(a.state){
    case 'walk': case 'layWalk':
      moving = moveStep(a, dt);
      if(!moving){ if(a.state === 'layWalk'){ a.state = 'walk'; } arrive(a); }
      break;
    case 'eat':
      a.stateT -= dt;
      if(a.food && foods.includes(a.food)) a.food.mesh.scale.copy(a.food.base).multiplyScalar(Math.max(.01, a.stateT/a.eatMax));
      if(a.sp === 'sheep'){ a.chewT -= dt; if(a.chewT <= 0){ a.chewT = .35; if(sel === 'sheep') munch(); } }
      if(a.stateT <= 0) finishEat(a);
      break;
    case 'idle':
      a.stateT -= dt;
      if(!seekFood(a) && a.stateT <= 0) idleChoice(a);
      break;
    case 'lay':
      a.stateT -= dt;
      if(a.stateT <= 0) finishLay(a);
      break;
    case 'parade':
      a.stateT -= dt; a.paraA -= dt*.5;
      a.target.set(POND.x + Math.cos(a.paraA - .4)*2.7, 0, POND.z + Math.sin(a.paraA - .4)*2.7);
      moving = moveStep(a, dt);
      if(a.stateT <= 0){ a.state = 'idle'; a.stateT = 2; say(a, '呱！好好玩～', 1.6); quack(2); hearts(a, 3); }
      break;
    case 'milk':
      a.stateT -= dt; a.squirtT -= dt;
      if(a.squirtT <= 0){ a.squirtT = .28; squirt(); }
      bucketFill(clamp(1 - a.stateT/3.5, 0, 1));
      if(a.stateT <= 0) finishMilk(a);
      break;
    case 'trick':
      a.stateT -= dt;
      if(a.trick === 'spin') a.g.rotation.y += dt*Math.PI*2/1.3;
      if(a.trick === 'flip'){ a.pose = 'flip'; a.rollA = Math.PI*2*clamp(1 - a.stateT/1.3, 0, 1); }
      if(a.stateT <= 0) finishTrick(a);
      break;
    case 'fetch':
      if(!ball){ a.state = 'idle'; a.stateT = 1; break; }
      a.target.set(ball.mesh.position.x, 0, ball.mesh.position.z);
      moving = moveStep(a, dt);
      if(ball.state === 'ground' && a.g.position.distanceTo(a.target) < .6) pickBall(a);
      break;
    case 'crouch':
      a.stateT -= dt;
      if(a.stateT <= 0) startPounce(a);
      break;
    case 'pounce': {
      a.stateT -= dt;
      const k = clamp(1 - a.stateT/.5, 0, 1);
      a.g.position.x = a.pFrom.x + (a.pTo.x - a.pFrom.x)*k;
      a.g.position.z = a.pFrom.z + (a.pTo.z - a.pFrom.z)*k;
      a.extraY = Math.sin(Math.PI*k)*.6;
      if(a.stateT <= 0){ a.extraY = 0; catchToy(a); }
      break;
    }
    case 'roll':
      a.stateT -= dt;
      if(a.sp === 'pig'){
        a.rollA = 1.4 + 1.3*Math.sin(t*5);
        a.mudT -= dt;
        if(a.mudT <= 0){ a.mudT = .3; bits(a.g.position.clone().setY(.3), 0x7a5230, 2, .7); if(sel === 'pig') splash(); }
        if(a.stateT < 2) a.P.mud.forEach((m, i) => { if(i < (3.2 - a.stateT)*4) m.visible = true; });
      }
      if(a.stateT <= 0) finishRoll(a);
      break;
    case 'bath':
      a.stateT -= dt; a.bubT -= dt;
      if(a.bubT <= 0){
        a.bubT = .07;
        bubble(a.g.position.clone().add(new V3((Math.random()-.5)*1, .3 + Math.random()*.6, (Math.random()-.5)*1)));
        if(Math.random() < .3 && sel === 'pig') pop();
      }
      a.P.mud.forEach((m, i) => { if(i >= a.P.mud.length*(a.stateT/2.6)) m.visible = false; });
      if(a.stateT <= 0) finishBath(a);
      break;
    case 'chase': {
      a.stateT -= dt;
      const pp = playerPoint();
      a.target.copy(clampDomain(a, pp));
      moving = moveStep(a, dt);
      a.honkT -= dt;
      if(a.honkT <= 0){ honk(); a.honkT = .45; }
      if(a.g.position.distanceTo(pp) < 3) shakeT = .2;
      if(a.stateT <= 0){ walkTo(a, homePoint(a), 1); say(a, '哼！知道厲害了吧', 1.6); setTimeout(() => { if(sel === 'goose') hint(HINTS.goose); }, 1500); }
      break;
    }
  }
  a.moving = moving;
  let hy = 0;
  if(a.hopT > 0){ a.hopT -= dt; hy = Math.abs(Math.sin((.6 - a.hopT)/.6*Math.PI*2))*a.hopH; }
  a.g.position.y = (a.water ? Math.sin(t*2 + a.seed)*.015 : 0) + hy + a.extraY;
  (a.sp === 'sheep' ? animSheep : a.quad ? animQuad : animBird)(a, dt, t, moving);
}

function updateFx(dt, t){
  for(let i=fx.length - 1;i>=0;i--){
    const f = fx[i];
    if(f.delay > 0){ f.delay -= dt; f.o.visible = false; continue; }
    f.o.visible = true; f.life -= dt;
    f.o.position.addScaledVector(f.v, dt);
    if(f.grav) f.v.y -= 4*dt;
    const k = Math.max(0, f.life/f.max);
    f.o.material.opacity = f.grow ? k*.8 : k;
    if(f.sprite) f.o.scale.setScalar(f.sprite*(1.2 - k*.2));
    if(f.grow) f.o.scale.setScalar(.2 + (1 - k)*f.grow);
    if(f.life <= 0){ scene.remove(f.o); f.o.material.dispose(); fx.splice(i, 1); }
  }
  for(const f of foods) if(f.type === 'bread' && !f.claim) f.mesh.position.y = .07 + Math.sin(t*2.2 + f.pos.x)*.012;
  for(const e of eggs) if(e.userData.pop < 1){ e.userData.pop = Math.min(1, e.userData.pop + dt*3); const s = e.userData.pop*(1 + Math.sin(e.userData.pop*Math.PI)*.3); e.scale.set(.11*s, .14*s, .11*s); }
}

const bubbleEl = $('bubble');
function updateBubble(dt){
  if(bubbleT > 0){ bubbleT -= dt; if(bubbleT <= 0) bubbleEl.style.opacity = 0; }
  if(!speaker) return;
  const p = headPos(speaker); p.y += speaker.P.bubbleY;
  p.project(camera);
  const x = (p.x*.5 + .5)*innerWidth, y = (-p.y*.5 + .5)*innerHeight;
  bubbleEl.style.transform = `translate(${x - bubbleEl.offsetWidth/2}px, ${y - bubbleEl.offsetHeight}px)`;
  if(p.z > 1) bubbleEl.style.opacity = 0;
}

function focusPoint(){
  let p;
  if(sel === 'goose') p = geese[0].g.position.clone().add(geese[1].g.position).multiplyScalar(.5);
  else p = MAIN[sel].g.position.clone();
  p.y = SP[sel].fy; return p;
}

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  layCD -= dt; milkCD -= dt;
  updateBallToy(dt, t);
  animals.forEach(a => updateAnimal(a, dt, t));
  separate();
  updateFx(dt, t);
  const ft = focusPoint();
  if(focusT > 0){
    focusT -= dt;
    const dir = camera.position.clone().sub(controls.target).normalize();
    if(dir.y < .4){ dir.y = .5; dir.normalize(); }
    const want = ft.clone().addScaledVector(dir, SP[sel].dist*(camera.aspect < 1 ? 1.3 : 1));
    const k = Math.min(1, dt*3.5);
    camera.position.lerp(want, k); controls.target.lerp(ft, k);
  } else controls.target.lerp(ft, Math.min(1, dt*1.5));
  controls.update();
  for(const c of clouds){ c.position.x += c.userData.v*dt; if(c.position.x > 55) c.position.x = -55; }
  let sx = 0, sy = 0;
  if(shakeT > 0){ shakeT -= dt; sx = (Math.random()-.5)*.12; sy = (Math.random()-.5)*.12; camera.position.x += sx; camera.position.y += sy; }
  renderer.render(scene, camera);
  camera.position.x -= sx; camera.position.y -= sy;
  updateBubble(dt);
}

buildTools(); refreshUI(); hint(HINTS.sheep);
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function unlockAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    if(actx) loadRealSounds();
  }
  if(actx && actx.state !== 'running') actx.resume().catch(() => {});
}
// iOS 鎖屏或切到別的 App 回來後，Web Audio 會被暫停：碰螢幕時自動恢復
['pointerdown', 'touchend', 'click'].forEach(ev => addEventListener(ev, () => { if(actx) unlockAudio(); }, true));
document.addEventListener('visibilitychange', () => { if(!document.hidden && actx && actx.state !== 'running') actx.resume().catch(() => {}); });
// 玩過的人直接進園，第一次碰螢幕時才啟動聲音
if(store.get('visited', false)){
  $('intro').style.display = 'none';
  const first = () => {
    ['pointerdown', 'touchend'].forEach(ev => removeEventListener(ev, first, true));
    unlockAudio();
    setTimeout(() => { voice(sel); MAIN[sel].look = 2.5; }, 300);
  };
  ['pointerdown', 'touchend'].forEach(ev => addEventListener(ev, first, true));
  setTimeout(() => say(sheepA, '咩～歡迎回來！', 2.4), 800);
}
$('startBtn').onclick = () => {
  unlockAudio(); store.set('visited', true);
  $('intro').style.display = 'none';
  setTimeout(() => { baa(1); say(sheepA, AFF.sheep > 0 ? '咩～（記得你喔）' : '咩～？', 2.2); sheepA.look = 2.5; }, 600);
};
})();
</script>

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
