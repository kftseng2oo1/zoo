      <stop offset="1" stop-color="#d6f0ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd16a"/>
      <stop offset="1" stop-color="#5fae3c"/>
