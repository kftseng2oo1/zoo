    <circle cx="186" cy="178" r="56"/><circle cx="326" cy="178" r="56"/>
    <circle cx="160" cy="246" r="52"/><circle cx="352" cy="246" r="52"/>
    <circle cx="196" cy="306" r="54"/><circle cx="316" cy="306" r="54"/>
